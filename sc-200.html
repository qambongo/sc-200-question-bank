  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Automated Investigation and Response (AIR) has successfully removed a malicious phishing email and isolated the user's device. According to Microsoft best practices, what is the analyst's immediate next step?",o:["A. Close the incident immediately since AIR has resolved the alert.","B. Validate the scope of the attack to ensure no follow-on identity or cloud access occurred.","C. Reverse the device isolation to restore business operations.","D. Run an antivirus scan on the entire Exchange Online tenant."],c:1,e:["Incorrect. Closing the incident immediately is premature; AIR only addresses the specific artifacts it found, not the broader attack chain.","Correct. AIR outcomes must be validated by an analyst. You must verify if the attacker achieved their objective (e.g., credential theft) and check for follow-on activity like suspicious sign-ins or cloud app access.","Incorrect. Reversing isolation before validating the full scope could allow an active attacker to continue lateral movement.","Incorrect. Running an AV scan on the entire tenant is unnecessary and does not address the specific scope of this user's compromise."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Microsoft Defender XDR's Automatic Attack Disruption feature isolates a compromised device and disables a user account during an active ransomware attack. What is the primary purpose of these specific actions within the context of attack disruption?",o:["A. To perform a full forensic analysis of the device memory.","B. To create attack chain breakpoints that prevent the attacker from continuing to the next stage.","C. To automatically restore the device from the last known good backup.","D. To generate a custom detection rule for future prevention."],c:1,e:["Incorrect. Forensic analysis is an investigation action, not the primary purpose of automated disruption.","Correct. Automatic attack disruption focuses on creating 'attack chain breakpoints'—interrupting the attacker's ability to continue the next stage of the attack (e.g., lateral movement or data encryption) by restricting compromised entities.","Incorrect. Attack disruption does not automatically restore backups; it focuses on immediate containment.","Incorrect. Generating detection rules is a proactive configuration task, not a real-time disruption action."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"A Data Loss Prevention (DLP) alert triggers because a user sent an email containing credit card numbers to an external address. The user claims they were sending the data to an approved external legal adviser. How should the analyst determine the validity of this claim?",o:["A. Automatically close the alert as a false positive since the user provided a business justification.","B. Block the user's internet access immediately to prevent further data loss.","C. Evaluate the context: verify the destination domain against the approved partner list, check the data sensitivity, and review the user's intent against normal business use.","D. Delete the email from the recipient's mailbox without further investigation."],c:2,e:["Incorrect. Analysts must validate the claim against policy and context before closing an alert.","Incorrect. Blocking internet access is an overly aggressive containment step that disrupts business before validation is complete.","Correct. DLP investigation requires context. The analyst must evaluate the sensitive data involved, the action taken, the destination (verifying if it's an approved partner), and the user's intent against normal business use to determine if it's acceptable or a violation.","Incorrect. Deleting the email destroys evidence before the investigation and context analysis are complete."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Microsoft Defender for Cloud generates a high-severity alert indicating suspicious PowerShell execution on a production Azure Virtual Machine. What is the most appropriate first step in the investigation?",o:["A. Immediately delete the virtual machine to contain the threat.","B. Isolate the virtual machine from the virtual network.","C. Trace the resource activity to examine the actual processes, commands executed, and network connections.","D. Review the Azure Activity Log to see who created the virtual machine."],c:2,e:["Incorrect. Deleting the VM destroys forensic evidence and causes severe business disruption.","Incorrect. While isolation might be a later containment step, the first step is to investigate and understand the scope of the activity on the workload.","Correct. In Defender for Cloud, you must validate the alert by examining the actual resource activity (processes, commands, network connections) to understand how the behavior unfolded before taking containment actions.","Incorrect. The Azure Activity Log shows management plane operations (like VM creation), not the runtime execution of malicious processes inside the VM."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Microsoft Defender for Cloud Apps alerts you to a third-party OAuth application that has been granted `Mail.ReadWrite` and `Files.ReadWrite.All` permissions. The app is accessing user mailboxes in the background without any user signed in. What is the primary risk, and what is the immediate remediation?",o:["A. Risk: The app can reset passwords. Step: Force a password reset for all users.","B. Risk: The app can modify Azure RBAC roles. Step: Check the Audit log for role changes.","C. Risk: The app can isolate endpoints. Step: Check Defender for Endpoint for isolation events.","D. Risk: The app can read and modify user mail and files. Step: Revoke the application's consent and investigate the OAuth grant."],c:3,e:["Incorrect. The granted permissions are for Mail and Files, not directory password resets.","Incorrect. The permissions do not include Azure RBAC or directory role management.","Incorrect. The permissions do not grant endpoint management capabilities.","Correct. Application permissions allow an app to act independently without a signed-in user. The immediate step is to revoke the application's consent/permissions to stop the unauthorized access and investigate how the OAuth grant was approved."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"In Microsoft Entra ID, you are investigating a compromised identity. You see a high 'User Risk' score and a separate high 'Sign-in Risk' score. How should you interpret these signals?",o:["A. They are the same; both indicate a single failed login attempt.","B. 'User Risk' indicates the overall likelihood the identity is compromised based on aggregated signals, while 'Sign-in Risk' reflects the risk of a specific authentication event.","C. 'Sign-in Risk' overrides 'User Risk', meaning the user account is definitely safe.","D. Both signals require the immediate deletion of the user account."],c:1,e:["Incorrect. User risk and sign-in risk are distinct signals that operate independently but must be interpreted together.","Correct. 'User Risk' reflects the overall likelihood that an identity is compromised (e.g., leaked credentials) based on aggregated detections over time. 'Sign-in Risk' reflects the risk associated with a specific, individual authentication attempt (e.g., impossible travel).","Incorrect. A high sign-in risk does not negate a high user risk; they often reinforce each other.","Incorrect. Deletion is a destructive action; remediation should involve blocking sign-in, revoking sessions, and forcing password resets."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Microsoft Defender for Identity generates an alert indicating that a 'Honeytoken' account was used to attempt authentication against a domain controller. What does this signal indicate?",o:["A. A high-confidence signal of potential reconnaissance or credential misuse.","B. A legitimate administrator using a break-glass account for emergency maintenance.","C. A misconfigured service account attempting to sync with Azure AD.","D. A standard user who forgot their password and tried an old account."],c:0,e:["Correct. A honeytoken account is a decoy account that should never be used in normal activity. Any authentication or suspicious activity against it carries strong investigative weight, indicating potential reconnaissance or attempted credential misuse.","Incorrect. Break-glass accounts are legitimate, highly secured emergency accounts, not decoys designed to trigger alerts on any use.","Incorrect. Service accounts should not be configured to use honeytoken identities.","Incorrect. Standard users should not know about or attempt to use decoy honeytoken accounts."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Your SOC is investigating a sophisticated attack that has generated 30 separate incidents over the past week, all involving the same threat actor, overlapping IP addresses, and a specific group of user accounts. Investigating them individually is causing duplicated effort. What is the best practice for managing this situation?",o:["A. Group the related incidents into a single Case for coordinated investigation and task ownership.","B. Suppress all but one of the incidents to reduce noise.","C. Create a Summary Rule to aggregate the 30 incidents into one alert.","D. Change the automation rule to automatically close all incidents with the same IP address."],c:0,e:["Correct. Case management allows analysts to group related incidents into a single investigation, assign clear task ownership, track lifecycle progress, and document findings collaboratively, preventing fragmented analysis.","Incorrect. Suppressing incidents hides valuable investigative data and does not solve the underlying coordination problem.","Incorrect. Summary Rules are for pre-aggregating log data for query performance, not for grouping security incidents.","Incorrect. Automatically closing incidents based on a single indicator like an IP address is dangerous and will likely result in unresolved, active threats."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"While reviewing the Device Timeline, an analyst identifies a suspicious process execution. The analyst needs to determine if this same executable file has been observed running on other devices in the organization. What should the analyst do next?",o:["A. Export the entire device timeline to a CSV file.","B. Pivot from the timeline event to the file entity to view its broader activity.","C. Create a new custom detection rule for the file hash.","D. Initiate an automated investigation and response (AIR) job."],c:1,e:["Incorrect. Exporting the timeline only captures the local device history and does not provide cross-device visibility.","Correct. Pivoting from a timeline event to the associated entity (in this case, the file) allows the analyst to view its broader activity, prevalence, and execution history across other devices in the environment.","Incorrect. Creating a custom detection rule is a proactive measure for future detection, not an immediate investigative step to check historical prevalence.","Incorrect. Initiating an AIR job is a response action, not an investigative step to check file prevalence across the environment."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"An analyst needs to execute a custom PowerShell script on a compromised endpoint to gather specific volatile memory artifacts that are not collected by the standard Investigation Package. The device is currently isolated from the internet but retains connection to the Defender cloud. Which tool should the analyst use?",o:["A. Automated Investigation and Response (AIR)","B. Live Response","C. Microsoft Sentinel Playbook","D. Advanced Hunting"],c:1,e:["Incorrect. AIR follows predefined, automated investigation logic and cannot execute ad-hoc custom PowerShell scripts on demand.","Correct. Live Response provides a secure, remote command-line session to an isolated endpoint, allowing analysts to run custom scripts and gather specific forensic artifacts.","Incorrect. Sentinel Playbooks (Logic Apps) orchestrate API calls but do not provide interactive, ad-hoc command-line access to endpoints.","Incorrect. Advanced Hunting is a read-only query interface for telemetry; it cannot execute scripts on endpoints."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"Automatic Attack Disruption has isolated a device and disabled a user account. What is the analyst's immediate next step regarding the automated containment?",o:["A. Close the incident immediately since the automated system has resolved the threat.","B. Validate the scope of the attack to ensure no follow-on identity or cloud access occurred and that the containment is sufficient.","C. Reverse the device isolation immediately to restore business operations.","D. Run an antivirus scan on the entire Exchange Online tenant."],c:1,e:["Incorrect. Closing the incident immediately is premature; automated actions only address the specific artifacts found, not necessarily the broader attack chain.","Correct. The analyst must validate the automated actions, confirm the scope of the attack, and check for follow-on activity to ensure the threat is fully contained and the disruption was effective.","Incorrect. Reversing isolation before validating the full scope could allow an active attacker to continue lateral movement if the initial containment was insufficient.","Incorrect. Running an AV scan on the entire tenant is unnecessary and does not address the specific scope of this user's or device's compromise."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"You need to configure an alert suppression rule in Microsoft Defender XDR for a known, benign administrative task that triggers repetitive, low-value alerts. What is the primary effect of this configuration?",o:["A. The detection logic is disabled, and no telemetry is collected for this activity.","B. The detection may still occur, but the alert is not surfaced to analysts, reducing triage noise.","C. The alert is converted into a behavior record, preserving it for hunting but hiding it from the incident queue.","D. The incident is automatically closed with a 'False Positive' classification."],c:1,e:["Incorrect. Suppression does not disable the underlying detection logic or stop telemetry collection; it only filters the alert output.","Correct. Alert suppression prevents known, benign activity from surfacing as an alert, allowing analysts to focus on unknown or high-risk activity without losing the underlying detection capability.","Incorrect. Converting to a behavior record is a function of Alert Tuning, not Alert Suppression.","Incorrect. Suppression prevents the alert from surfacing in the first place; it does not create and then close an incident."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"An approved administrative script triggers a known detection rule daily. You want to stop the alert from surfacing to analysts, but you still want the underlying telemetry to remain available for threat hunting. Which configuration should you use?",o:["A. Alert Suppression","B. Alert Tuning (convert to behavior record or hide)","C. Disable the detection rule","D. Lower the incident severity to Informational"],c:1,e:["Incorrect. Alert suppression prevents the alert from surfacing, but tuning is the preferred method when you want to handle the alert differently while preserving the underlying telemetry for hunting.","Correct. Alert tuning allows you to define conditions for known, benign activity and choose to hide the alert or convert it to a behavior record, ensuring the telemetry remains available for hunting without creating triage noise.","Incorrect. Disabling the rule removes the detection capability entirely, which could blind you to malicious use of the same technique by an attacker.","Incorrect. Lowering severity still generates an alert and incident, failing to solve the problem of repetitive, low-value triage."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"You are configuring an Attack Surface Reduction (ASR) rule to prevent users from executing scripts downloaded from email attachments. You want to test the impact of this rule on legitimate business processes before actively blocking the behavior. Which enforcement mode should you select?",o:["A. Block","B. Audit","C. Disabled","D. Warn"],c:1,e:["Incorrect. Block mode prevents the behavior entirely, which could disrupt legitimate business processes before testing.","Correct. Audit mode allows the behavior to occur but records it, providing visibility into the rule's impact without enforcing the restriction.","Incorrect. Disabled mode turns the rule off entirely, providing no visibility or testing capability.","Incorrect. Warn is not a valid enforcement mode for ASR rules; the valid modes are Block, Audit, and Disabled."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"You need to collect specific Windows Event Logs, such as PowerShell Operational logs or Sysmon logs, which are not collected by the default Microsoft Defender for Endpoint telemetry baseline. Where should you configure this?",o:["A. In the Microsoft Sentinel Analytics Rules.","B. In the Custom Data Collection settings in Microsoft Defender for Endpoint or via Intune.","C. In the Alert Tuning rules.","D. In the Microsoft Defender XDR email notification settings."],c:1,e:["Incorrect. Analytics rules evaluate data after it has been ingested; they do not control what telemetry is collected from the endpoint.","Correct. Custom data collection extends the baseline telemetry by allowing additional event sources (like specific Windows Event Logs or registry paths) to be ingested for hunting and detection, configured via Defender for Endpoint settings or Intune.","Incorrect. Alert tuning rules adjust how generated alerts are handled, not what data is collected from the endpoint.","Incorrect. Email notifications are for communication and have no bearing on endpoint telemetry collection."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"You are configuring Automated Investigation and Response (AIR) in Microsoft Defender for Endpoint. You want AIR to automatically remediate threats on standard user workstations without analyst approval, but you want to require manual approval for any remediation actions on domain controllers. How should you configure this?",o:["A. Set the automation level to 'Full' for the default device group and 'None' for all other groups.","B. Create separate device groups for workstations and domain controllers, setting automation levels to 'Full' and 'Semi' respectively.","C. Use Microsoft Sentinel Automation Rules to approve AIR actions based on the device's OU.","D. Configure an Alert Suppression rule for domain controllers."],c:1,e:["Incorrect. Setting automation to 'None' prevents AIR from running at all, rather than requiring manual approval (which is 'Semi').","Correct. Device groups allow you to segment endpoints and apply different AIR automation levels. 'Full' allows automatic remediation, while 'Semi' requires analyst approval for remediation actions.","Incorrect. Sentinel Automation Rules manage Sentinel incident workflows, not Defender for Endpoint AIR automation levels.","Incorrect. Alert suppression hides alerts; it does not configure the approval workflow for automated remediations."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"A security engineer is designing an automated response workflow in Microsoft Sentinel. They need to understand the boundary between Automation Rules and Playbooks. Which statement accurately describes their roles?",o:["A. Automation Rules execute response actions across systems, while Playbooks evaluate incident conditions.","B. Automation Rules manage incident workflow (assignment, tagging, status) and can trigger Playbooks, which execute the actual response actions.","C. Automation Rules and Playbooks are interchangeable terms for the same Logic App workflow.","D. Automation Rules are used for threat detection, while Playbooks are used for incident assignment."],c:1,e:["Incorrect. This is the exact reverse of their actual functions.","Correct. Automation Rules act as the decision layer, evaluating incident conditions and managing workflow (like assignment or triggering a playbook). Playbooks act as the execution layer, performing the actual response actions via Logic Apps.","Incorrect. They serve distinct purposes in the automation pipeline and are not interchangeable.","Incorrect. Analytics Rules are used for threat detection. Automation Rules manage incident workflow."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"During an investigation, Microsoft Security Copilot provides a summary of a complex, multi-domain incident and suggests isolating a specific device. According to Microsoft best practices, how should the analyst treat these suggestions?",o:["A. As automatic approvals that should be executed immediately to reduce dwell time.","B. As mandatory actions that must be completed before the incident can be closed.","C. As recommendations that require the analyst to validate the underlying evidence and confirm the scope before acting.","D. As background tasks that Copilot will execute automatically after a 15-minute delay."],c:2,e:["Incorrect. Copilot suggestions should never be treated as automatic approvals; human judgment is required to prevent unintended business disruption.","Incorrect. Copilot does not enforce mandatory actions; the analyst retains full control over the incident response lifecycle.","Correct. Copilot recommendations are assistive. The analyst must still validate the evidence, confirm the affected scope, and choose the response that fits the actual incident context.","Incorrect. Copilot does not automatically execute response actions in the background without explicit analyst approval."]},

  {m:"Chapter 8: Investigate Microsoft 365 Activities to Identify Threats",q:"An investigator needs to locate specific emails related to a suspected insider threat. However, the legal department also requires that these emails be preserved in their current state so they cannot be deleted or altered by the user during the investigation. Which Microsoft Purview tool should the investigator use?",o:["A. Content Search","B. eDiscovery Hold (Preservation)","C. Audit Log Search","D. Microsoft Graph Activity Logs"],c:1,e:["Incorrect. Content Search locates and exports data, but it does not inherently prevent the user from deleting or altering the original data in their mailbox.","Correct. eDiscovery Hold (or Preservation) ensures that content is retained in its current state and cannot be permanently deleted or altered by the user, satisfying legal and investigative preservation requirements.","Incorrect. Audit Log Search tracks metadata about actions (like deletion), but does not prevent the deletion or preserve the content itself.","Incorrect. Microsoft Graph Activity Logs track API operations, not the preservation of mailbox content."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Microsoft Defender for Cloud Apps detects an active session where a user is downloading an unusually large volume of sensitive data from a SaaS application from an unrecognized IP address. What is the most appropriate immediate response to stop the data exfiltration?",o:["A. Apply session control to restrict or terminate the active session.","B. Delete the user's account from Microsoft Entra ID.","C. Run an antivirus scan on the user's local device.","D. Create a Microsoft Sentinel Analytics Rule for the SaaS application."],c:0,e:["Correct. Session control in Defender for Cloud Apps allows analysts to restrict or terminate active sessions to immediately stop ongoing unauthorized data access or exfiltration while the investigation continues.","Incorrect. Deleting the user account causes severe business disruption and destroys the identity object needed for investigation.","Incorrect. An AV scan on the local device does not address cloud-based session activity or SaaS data exfiltration.","Incorrect. Analytics rules detect future activity; they do not stop an active, ongoing session."]},

  // ==========================================

  {m:"Chapter 7: Detect Threats by Using the Microsoft Sentinel Platform",q:"An analyst needs to investigate a sophisticated threat actor who operated in the environment 6 months ago. The required telemetry is no longer in the interactive analytics tier but resides in the long-term retention tier. The analyst attempts a standard log query, but it fails to return results. What should the analyst use instead?",o:["A. A Near-Real-Time (NRT) Analytics Rule","B. A Search Job","C. A Summary Rule","D. Advanced Hunting in Defender XDR"],c:1,e:["Incorrect. NRT Analytics Rules are for detecting new threats in real-time, not retrieving historical data.","Correct. Search Jobs are designed for background processing and large-scale or historical retrieval from the data lake tier (long-term retention), where standard interactive queries cannot reach.","Incorrect. Summary Rules pre-aggregate recent data for performance optimization, they do not retrieve aged historical data.","Incorrect. Advanced Hunting in Defender XDR queries XDR-specific retention (typically 30 days to 6 months max depending on licensing), not the Sentinel data lake tier."]},

  {m:"Chapter 7: Detect Threats by Using the Microsoft Sentinel Platform",q:"You are deciding between using a Standard Log Query and a Search Job for an investigation. In which scenario is a Standard Log Query the correct choice?",o:["A. When you need to retrieve massive volumes of historical data from the data lake tier.","B. When the scenario requires fast, interactive analysis of recent data in the analytics tier.","C. When you need to run a query that takes over 4 hours to complete.","D. When you want to schedule a background process to run overnight."],c:1,e:["Incorrect. Retrieving massive historical data from the data lake tier requires a Search Job.","Correct. Standard log queries operate in interactive mode, providing immediate or near-immediate results. They are best used for fast investigation of recent data residing in the analytics tier.","Incorrect. Long-running queries over massive datasets are the use case for Search Jobs (background processing).","Incorrect. Background processing and overnight scheduling describe Search Jobs or Analytics Rules, not interactive standard log queries."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"An analyst is reviewing a single alert for a malicious file execution. To understand the full scope of the compromise, the analyst uses a feature that expands outward from the initial file entity to reveal related users, devices, processes, and network activity. What feature is the analyst using?",o:["A. Device Timeline","B. Investigation Graph","C. Advanced Hunting","D. Alert Tuning"],c:1,e:["Incorrect. The Device Timeline shows a chronological sequence of events on a single specific device, not the outward expansion across multiple entities.","Correct. The Investigation Graph expands outward from an initial entity to reveal related users, devices, and network activity, moving the investigation from isolated events to a connected view of how the activity unfolded.","Incorrect. Advanced Hunting is a KQL-based query tool, not a visual graph that automatically expands outward from an entity.","Incorrect. Alert Tuning is used to suppress or modify how alerts are surfaced, not to investigate entity relationships."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Your SOC successfully isolated a compromised server to stop an active ransomware encryption process. According to incident response principles, what is the critical limitation of this containment action?",o:["A. Isolation automatically deletes all forensic evidence on the server.","B. Containment limits what can happen next, but it does not remove what has already occurred or eliminate persistence.","C. Isolation prevents the SOC from ever reconnecting to the server for remediation.","D. Containment automatically triggers a factory reset of the server."],c:1,e:["Incorrect. Isolation preserves the state of the machine for forensics; it does not delete evidence.","Correct. Containment limits what can happen next (stopping lateral movement or encryption), but it does not remove what has already occurred. The investigation must continue to identify remaining artifacts and eliminate persistence.","Incorrect. Isolation maintains a secure connection to the Defender cloud, allowing analysts to use Live Response for remediation.","Incorrect. Isolation restricts network traffic; it does not trigger a factory reset."]},

  {m:"Chapter 6: Detect Threats by Using Microsoft Defender XDR",q:"An analyst is formulating a threat hunting hypothesis: 'Which process initiated this suspicious outbound network connection?' According to the principle of mapping investigation scenarios to tables, which data source should the analyst query?",o:["A. IdentityLogonEvents","B. DeviceNetworkEvents and DeviceProcessEvents","C. EmailEvents","D. CloudAppEvents"],c:1,e:["Incorrect. IdentityLogonEvents tracks authentication and sign-in activity, not process-level network connections.","Correct. To answer questions about process execution and network connections on an endpoint, the analyst must align the scenario with endpoint telemetry tables like DeviceNetworkEvents and DeviceProcessEvents.","Incorrect. EmailEvents tracks message delivery and routing, not endpoint process activity.","Incorrect. CloudAppEvents tracks SaaS and cloud application activity, not local endpoint process network connections."]},

  {m:"Chapter 6: Detect Threats by Using Microsoft Defender XDR",q:"An analyst is investigating an identity compromise and asks: 'Which user signed in from an unfamiliar location and what conditional access policies were applied?' Which security domain and primary telemetry should the analyst focus on?",o:["A. Endpoint domain; Process execution and device alerts","B. Identity domain; Sign-ins, authentication events, and risky users","C. Cloud applications domain; Session behavior and app permissions","D. Workloads domain; Resource alerts and configuration changes"],c:1,e:["Incorrect. Endpoint telemetry focuses on devices, files, and processes, not centralized identity sign-ins.","Correct. The Identity domain provides primary telemetry such as sign-ins, authentication events, and risky users, which is required to analyze unfamiliar locations and conditional access policy applications.","Incorrect. Cloud applications focus on SaaS activity and data access, not the core identity authentication event itself.","Incorrect. Workloads focus on Azure/cloud resource management and runtime behavior, not user identity sign-ins."]},

  {m:"Chapter 4: Ingest Data into Microsoft Sentinel",q:"You are designing a Windows Event Forwarding (WEF) architecture to collect Windows Security events from 500 legacy servers without installing third-party agents on each one. In this architecture, what defines *which* specific events are forwarded from the source servers to the central collector?",o:["A. Data Collection Rules (DCRs)","B. WEF Subscriptions","C. Azure Policy definitions","D. Syslog facilities"],c:1,e:["Incorrect. Data Collection Rules (DCRs) are used to configure the Azure Monitor Agent (AMA), not native WEF.","Correct. In a WEF architecture, subscriptions are configured (often via Group Policy) to define exactly which event logs, IDs, and queries are forwarded from the source systems to the collector.","Incorrect. Azure Policy enforces Azure resource configurations, not native Windows OS event forwarding subscriptions.","Incorrect. Syslog facilities apply to Linux and network device logging, not Windows Event Forwarding."]},

  {m:"Chapter 4: Ingest Data into Microsoft Sentinel",q:"In a Windows Event Forwarding (WEF) deployment, what is the role of the 'collector system'?",o:["A. It generates the security events and sends them to the cloud.","B. It receives selected events from multiple source systems and stores them centrally before ingestion into the SIEM.","C. It acts as the firewall blocking malicious network traffic.","D. It automatically remediates threats found in the forwarded events."],c:1,e:["Incorrect. The source servers generate the events, not the collector.","Correct. The collector system receives the selected events forwarded from multiple source systems via WEF subscriptions, acting as a central aggregation point before the data is ingested into Microsoft Sentinel.","Incorrect. WEF is a log collection mechanism, not a network firewall.","Incorrect. WEF collectors aggregate logs; they do not perform automated threat remediation."]},

  {m:"Chapter 2: The Evolution of Security and Security Operations",q:"A traditional SOC is suffering from 'slow triage times' and 'tooling fragmentation'. Analysts spend hours manually comparing feeds from disconnected systems. According to modern security operations principles, what is the primary way to resolve this?",o:["A. Hiring more Tier 1 analysts to manually process the feeds faster.","B. Integrating enterprise security systems into automation, coordination, and threat intelligence backends.","C. Disabling all behavioral analytics to reduce the number of alerts.","D. Reverting to a strictly perimeter-based 'four-wall' security model."],c:1,e:["Incorrect. Scaling manual processes does not solve tooling fragmentation or the root cause of slow triage.","Correct. Resolving traditional SOC issues requires integrating systems with automation, coordination, and threat intelligence backends to provide context, filter false positives, and speed up triage.","Incorrect. Disabling analytics creates blind spots and does not solve the underlying fragmentation of tools.","Incorrect. The perimeter-based model is obsolete and fails to address modern cloud and remote work visibility issues."]},

  {m:"Chapter 8: Investigate Microsoft 365 Activities to Identify Threats",q:"During an investigation into potential data exfiltration via Microsoft 365, you have defined your search scope in Microsoft Purview. What is the critical next step that determines how effectively the search isolates the relevant data?",o:["A. Exporting all data to a CSV file for offline review.","B. Constructing targeted queries that identify relevant content within the defined scope.","C. Applying a Legal Hold to all user mailboxes.","D. Resetting the passwords of all users in the scope."],c:1,e:["Incorrect. Exporting all data without filtering creates massive noise and does not isolate the relevant data.","Correct. Once the scope is defined, constructing targeted queries (using keywords, dates, and specific properties) determines how effectively the search isolates the specific data associated with the investigation.","Incorrect. Legal Hold preserves data but does not help isolate or identify the specific exfiltrated content.","Incorrect. Resetting passwords is a remediation step, not an investigative step for isolating data."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"When analyzing telemetry across Microsoft Defender XDR, which security domain provides primary telemetry regarding 'User activity, session behavior, app permissions, and data access events'?",o:["A. Identity","B. Endpoint","C. Cloud applications","D. Email"],c:2,e:["Incorrect. Identity focuses on sign-ins, authentication, and credential signals.","Incorrect. Endpoint focuses on process execution, device alerts, and file activity.","Correct. The Cloud applications domain (powered by Defender for Cloud Apps) provides telemetry on user activity within SaaS apps, session behavior, OAuth app permissions, and data access events.","Incorrect. Email focuses on message activity, sender/recipient data, URLs, and attachments."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"Which security domain in Microsoft Defender XDR is responsible for providing telemetry on 'Resource alerts, workload activity, configuration changes, and runtime behavior'?",o:["A. Identity","B. Endpoint","C. Cloud applications","D. Workloads"],c:3,e:["Incorrect. Identity focuses on user authentication and credential signals.","Incorrect. Endpoint focuses on local device processes, files, and network connections.","Incorrect. Cloud applications focus on SaaS and third-party app activity and permissions.","Correct. The Workloads domain (powered by Microsoft Defender for Cloud) provides telemetry on cloud resource alerts, workload activity, infrastructure configuration changes, and runtime behavior."]},

  {m:"Chapter 6: Detect Threats by Using Microsoft Defender XDR",q:"An analyst identifies a suspicious behavior during a one-off manual search. To ensure this behavior is consistently surfaced whenever it appears again in the future, what should the analyst do in Microsoft Defender XDR?",o:["A. Save the search as a Bookmark in Microsoft Sentinel.","B. Build an advanced hunting query and convert it into a custom detection rule.","C. Increase the retention period of the data lake tier.","D. Export the results to a Threat Intelligence feed."],c:1,e:["Incorrect. Bookmarks save specific investigation findings in Sentinel, they do not continuously monitor for future occurrences.","Correct. To make an investigation repeatable and proactive, the analyst should build an advanced hunting query and convert it into a custom detection rule, which will consistently surface the behavior and generate alerts.","Incorrect. Increasing retention keeps data longer but does not automatically detect or surface specific behaviors.","Incorrect. Exporting results to a TI feed shares indicators, but does not create an internal detection mechanism for the behavioral pattern."]},

  {m:"Chapter 1: Preparing for Your Microsoft Exam and SC-200 Objectives",q:"According to best practices for preparing for the SC-200 exam and mastering the Microsoft security operations platform, what is the most critical step to actively practice and retain the concepts?",o:["A. Memorizing the KQL syntax without executing it.","B. Setting up a Microsoft demo tenant and validating concepts inside a lab environment.","C. Reading the product documentation without interacting with the portal.","D. Relying solely on third-party flashcards."],c:1,e:["Incorrect. Memorizing syntax without execution does not build the practical skills required for the exam or real-world operations.","Correct. Setting up a demo tenant and validating concepts in a lab allows you to actively practice, follow the investigation flow directly in the platform, and connect theory to real operational behavior.","Incorrect. Passive reading is insufficient for mastering a highly technical, scenario-based operations exam.","Incorrect. Flashcards help with terminology but cannot replace hands-on lab practice for complex investigation workflows."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"When following entity connections in the Investigation Graph, a user account leads to a device, that device to a process, and that process to further actions. What is the primary benefit of this progression?",o:["A. It allows the analyst to move through the activity without losing sight of how each element is related to the original event.","B. It automatically remediates all connected entities.","C. It deletes the original alert to reduce queue noise.","D. It converts the incident into a Fusion alert."],c:0,e:["Correct. Following linked entities introduces additional context, allowing the analyst to trace the blast radius and move through the activity without losing sight of how each element relates to the original event.","Incorrect. The Investigation Graph is an investigative visualization tool; it does not automatically remediate entities.","Incorrect. Tracing connections does not delete alerts; it expands the scope of the investigation.","Incorrect. Fusion alerts are generated by machine learning correlation rules in Sentinel, not by manually following entity graphs."]},

  {m:"Chapter 8: Investigate Microsoft 365 Activities to Identify Threats",q:"When performing user-focused analysis in Microsoft Purview audit logs, which core values must you evaluate to understand the context of an event?",o:["A. CPU usage, memory allocation, and disk I/O.","B. Who acted, what happened, where it happened, and which object was affected.","C. The BGP routing tables and DNS resolution logs.","D. The Azure RBAC role assignments and subscription quotas."],c:1,e:["Incorrect. CPU and memory metrics are endpoint performance metrics, not audit log values.","Correct. User-focused analysis in audit logs relies on evaluating who acted (UserId), what happened (Operation), where it happened (Workload/ClientIP), and which object was affected (ObjectId).","Incorrect. BGP and DNS are network infrastructure logs, not M365 user activity audit logs.","Incorrect. RBAC and quotas are Azure management plane concepts, not M365 user activity audit values."]},

  {m:"Chapter 7: Detect Threats by Using the Microsoft Sentinel Platform",q:"What is the defining difference in 'Result timing' between a Standard log query and a Search Job?",o:["A. Standard queries are delayed until the job completes; Search Jobs are immediate.","B. Standard queries provide immediate or near-immediate results; Search Jobs are delayed until the background job completes.","C. Both provide immediate results, but Search Jobs cost more.","D. Standard queries take days to complete; Search Jobs take seconds."],c:1,e:["Incorrect. This is reversed. Standard queries are immediate; Search Jobs are delayed.","Correct. Standard log queries operate interactively with immediate or near-immediate results. Search Jobs operate as background processing, meaning results are delayed until the job completes and populates the results table.","Incorrect. Search Jobs do not provide immediate results; they require background processing time.","Incorrect. Standard queries are immediate; they do not take days to complete."]},

  {m:"Chapter 4: Ingest Data into Microsoft Sentinel",q:"You are configuring the collection of Windows Security events using Windows Event Forwarding (WEF). Which component must be configured on the source Windows servers to establish the connection to the collector?",o:["A. The Azure Monitor Agent (AMA) service.","B. The Windows Remote Management (WinRM) service and Event Collector subscription.","C. The Syslog daemon.","D. The Microsoft Defender for Identity sensor."],c:1,e:["Incorrect. AMA is a separate agent-based collection method, not WEF.","Correct. WEF relies on the Windows Remote Management (WinRM) service and the configuration of Event Collector subscriptions on the source servers to push events to the collector.","Incorrect. Syslog is used for Linux and network devices, not native Windows event forwarding.","Incorrect. The MDI sensor collects identity telemetry directly from domain controllers, it is not the mechanism for general WEF."]},

  {m:"Chapter 2: The Evolution of Security and Security Operations",q:"How does the Zero Trust principle of 'Assume Breach' directly influence a SOC analyst's approach to investigating an internal lateral movement alert?",o:["A. The analyst ignores the alert because internal traffic is inherently trusted.","B. The analyst assumes the perimeter firewall has failed and focuses only on external ingress logs.","C. The analyst treats the internal alert with high priority, verifying explicitly and mapping the blast radius, acknowledging the attacker may already be inside.","D. The analyst immediately shuts down the entire corporate datacenter."],c:2,e:["Incorrect. Zero Trust explicitly rejects the idea that internal traffic is inherently trusted.","Incorrect. Assume breach focuses on internal segmentation and blast radius, not just external perimeter failures.","Correct. 'Assume Breach' dictates that the attacker may already be inside. Therefore, internal lateral movement alerts must be treated with high priority, verifying explicitly and mapping the blast radius to contain the threat.","Incorrect. Shutting down the datacenter is an extreme, business-destroying reaction, not a measured Zero Trust investigation technique."]},

  {m:"Chapter 6: Detect Threats by Using Microsoft Defender XDR",q:"An analyst needs to answer the question: 'Which email contained a specific malicious URL, and which users clicked it?' Which mapping of investigation scenario to tables is correct?",o:["A. DeviceNetworkEvents and DeviceProcessEvents","B. EmailEvents, EmailUrlInfo, and UrlClickEvents","C. IdentityLogonEvents and AlertEvidence","D. CloudAppEvents and SharePointAuditLogs"],c:1,e:["Incorrect. Device tables track endpoint network and process activity, not email delivery and clicks.","Correct. To investigate email delivery and user interaction with links, the analyst must map the scenario to email telemetry tables like EmailEvents (delivery), EmailUrlInfo (links in the email), and UrlClickEvents (user interaction).","Incorrect. Identity and Alert tables do not contain granular email URL and click data.","Incorrect. CloudAppEvents tracks SaaS activity, but specific email delivery and click telemetry is housed in the dedicated Email tables."]},

  {m:"Chapter 7: Detect Threats by Using the Microsoft Sentinel Platform",q:"When deciding on an analyst workflow for retrieving data, which workflow aligns with a Search Job?",o:["A. Adjust query and review results in real time.","B. Submit job, wait for completion, then query the results table.","C. Write a KQL query and immediately pin the results to an Azure Dashboard.","D. Run a playbook to automatically remediate the data."],c:1,e:["Incorrect. Adjusting queries and reviewing results in real time describes the interactive Standard Log Query workflow.","Correct. The Search Job workflow requires the analyst to submit the job, wait for the background processing to complete, and then query the newly created results table.","Incorrect. Pinning immediate results to a dashboard is a feature of interactive queries and workbooks, not asynchronous Search Jobs.","Incorrect. Playbooks automate response actions; they do not retrieve historical data lake archives."]},

  {m:"Chapter 9: Respond to Alerts and Incidents in Microsoft Defender XDR",q:"An incident involves a compromised identity that accessed a cloud application. The analyst needs to review the 'session behavior' and 'app permissions' granted to the application. Which Defender XDR portal section should the analyst navigate to?",o:["A. Microsoft Defender for Endpoint","B. Microsoft Defender for Office 365","C. Microsoft Defender for Cloud Apps","D. Microsoft Defender for Identity"],c:2,e:["Incorrect. Defender for Endpoint focuses on device processes, files, and network connections.","Incorrect. Defender for Office 365 focuses on email, attachments, and collaboration tools.","Correct. Microsoft Defender for Cloud Apps provides the telemetry for cloud application session behavior, OAuth app permissions, and data access events within SaaS environments.","Incorrect. Defender for Identity focuses on on-premises Active Directory signals and lateral movement."]},

  {m:"Chapter 10: Respond to Alerts and Incidents in Microsoft Defender for Endpoint",q:"You are using the Device Timeline to reconstruct an attack. You see a sequence where a Word document is opened, a macro executes, and a network connection is made. What is the primary value of viewing this as a sequence rather than isolated events?",o:["A. It allows the analyst to see how events relate to each other over time, confirming the attack path.","B. It automatically generates a Fusion alert in Sentinel.","C. It reduces the storage cost of the endpoint telemetry.","D. It prevents the attacker from executing the macro again."],c:0,e:["Correct. The Device Timeline brings the sequence into focus, turning scattered telemetry into a coherent chain of activity. This allows the analyst to see how events relate and confirm the exact attack path.","Incorrect. The Device Timeline is an investigative view; it does not generate Sentinel Fusion alerts.","Incorrect. Viewing data in a timeline does not affect the underlying storage costs of the telemetry.","Incorrect. Viewing historical telemetry does not proactively block future macro executions; that requires ASR rules or EDR block actions."]},

  {m:"Chapter 5: Configure Detections",q:"You are mapping investigation scenarios to data sources. Why is it important to 'recognize the type of activity and align it with the correct source' rather than just thinking in terms of tables first?",o:["A. Because tables change names frequently in Microsoft Sentinel.","B. Because every query begins with a question (e.g., 'Who signed in?'), and understanding the activity ensures you query the correct domain (Identity vs. Endpoint).","C. Because KQL does not support querying multiple tables at once.","D. Because thinking about tables first violates Zero Trust principles."],c:1,e:["Incorrect. Table names are generally stable; the issue is querying the wrong domain for the activity.","Correct. Every query begins with a business or security question. Recognizing the type of activity (e.g., authentication vs. process execution) ensures you align the question with the correct data source and domain, preventing wasted time querying the wrong tables.","Incorrect. KQL fully supports joining and unioning multiple tables.","Incorrect. Query methodology is a technical skill, not a direct violation of Zero Trust access principles."]},

  {m:"Chapter 11: Configure Automation for Microsoft Defender XDR and Microsoft Sentinel",q:"An automation rule in Microsoft Sentinel is configured to trigger a playbook when an incident is created. The playbook's goal is to enrich the incident with external threat intelligence. What must the playbook use to interact with the external REST API securely?",o:["A. A hardcoded API key stored in the playbook comments.","B. A Managed Identity and an HTTP/REST Connector.","C. A Windows Event Forwarding subscription.","D. A Data Collection Rule (DCR)."],c:1,e:["Incorrect. Hardcoding API keys is a severe security risk and violates best practices.","Correct. The playbook must use a Managed Identity for secure authentication and an HTTP/REST Connector to execute the API call and retrieve the threat intelligence.","Incorrect. WEF is for collecting Windows logs, not for Logic Apps interacting with REST APIs.","Incorrect. DCRs are used for ingesting and transforming data into Log Analytics, not for Logic App API interactions."]}

// --- QUIZ ENGINE ---
let currentQuestion = 0;
let correctCount = 0;
let incorrectCount = 0;
let selectedOption = null;
let answered = false;
let moduleScores = {};
let selectedModule = 'all';
let activeQuestions = [];
let questionStates = {};
const progressStorageKey = 'sc-200-quiz-progress';

function getModuleNames() {
  return [...new Set(questions.map(q => q.m))];
}

function populateModuleSelector() {
  const moduleSelect = document.getElementById('module-select');
  getModuleNames().forEach(moduleName => {
    const option = document.createElement('option');
    option.value = moduleName;
    option.textContent = `${moduleName} (${questions.filter(q => q.m === moduleName).length} questions)`;
    moduleSelect.appendChild(option);
  });
}

function setActiveQuestions() {
  activeQuestions = selectedModule === 'all'
    ? questions
    : questions.filter(q => q.m === selectedModule);
}

function initModuleScores() {
  activeQuestions.forEach(q => {
    if (!moduleScores[q.m]) moduleScores[q.m] = { correct: 0, total: 0 };
    moduleScores[q.m].total++;
  });
}

function setSaveStatus(message) {
  document.getElementById('save-status').textContent = message;
}

function saveProgress() {
  const progress = {
    currentQuestion,
    correctCount,
    incorrectCount,
    selectedOption,
    answered,
    questionStates,
    moduleScores,
    selectedModule
  };

  try {
    localStorage.setItem(progressStorageKey, JSON.stringify(progress));
    setSaveStatus('Progress saved');
  } catch (error) {
    setSaveStatus('Unable to save progress in this browser');
    console.error('Unable to save quiz progress.', error);
  }
}

function restoreProgress() {
  let savedProgress;
  try {
    const saved = localStorage.getItem(progressStorageKey);
    if (!saved) return false;
    savedProgress = JSON.parse(saved);
  } catch (error) {
    setSaveStatus('Unable to load saved progress');
    console.error('Unable to load quiz progress.', error);
    return false;
  }

  if (!savedProgress || typeof savedProgress !== 'object') return false;
  if (typeof savedProgress.selectedModule !== 'string') return false;
  if (savedProgress.selectedModule !== 'all' && !getModuleNames().includes(savedProgress.selectedModule)) return false;

  selectedModule = savedProgress.selectedModule;
  document.getElementById('module-select').value = selectedModule;
  setActiveQuestions();
  if (!activeQuestions.length || !Number.isInteger(savedProgress.currentQuestion)
      || savedProgress.currentQuestion < 0 || savedProgress.currentQuestion >= activeQuestions.length) {
    return false;
  }
  if (savedProgress.selectedOption !== null
      && (!Number.isInteger(savedProgress.selectedOption)
        || savedProgress.selectedOption < 0
        || savedProgress.selectedOption >= activeQuestions[savedProgress.currentQuestion].o.length)) {
    return false;
  }

  currentQuestion = savedProgress.currentQuestion;
  correctCount = Number.isInteger(savedProgress.correctCount) ? savedProgress.correctCount : 0;
  incorrectCount = Number.isInteger(savedProgress.incorrectCount) ? savedProgress.incorrectCount : 0;
  selectedOption = Number.isInteger(savedProgress.selectedOption) ? savedProgress.selectedOption : null;
  answered = savedProgress.answered === true;
  questionStates = savedProgress.questionStates && typeof savedProgress.questionStates === 'object'
    ? savedProgress.questionStates
    : {};
  if (!questionStates[currentQuestion]
      && (savedProgress.answered === true || Number.isInteger(savedProgress.selectedOption))) {
    questionStates[currentQuestion] = {
      selectedOption,
      answered
    };
  }
  moduleScores = savedProgress.moduleScores && typeof savedProgress.moduleScores === 'object'
    ? savedProgress.moduleScores
    : {};
  initModuleScores();
  setSaveStatus('Saved progress restored');
  return true;
}

function loadQuestion() {
  const q = activeQuestions[currentQuestion];
  const savedState = questionStates[currentQuestion];
  selectedOption = savedState && Number.isInteger(savedState.selectedOption)
    ? savedState.selectedOption
    : null;
  answered = savedState?.answered === true;
  
  document.getElementById('current-q').textContent = currentQuestion + 1;
  document.getElementById('total-q').textContent = activeQuestions.length;
  document.getElementById('module-tag').textContent = q.m;
  document.getElementById('question-text').textContent = q.q;
  
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  
  q.o.forEach((opt, index) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}.</span> <span>${opt.substring(3)}</span>`;
    div.onclick = () => selectOption(index, div);
    if (!answered && selectedOption === index) div.classList.add('selected');
    optionsContainer.appendChild(div);
  });

  document.getElementById('quiz-container').classList.remove('answer-incorrect');
  document.getElementById('question-text').classList.remove('answer-incorrect');
  document.getElementById('feedback-container').className = 'feedback';
  const explanationToggle = document.getElementById('explanation-toggle');
  explanationToggle.classList.add('hidden');
  explanationToggle.setAttribute('aria-expanded', 'false');
  explanationToggle.textContent = 'Show explanations';
  document.getElementById('explanations-container').classList.add('collapsed');
  document.getElementById('check-btn').disabled = selectedOption === null || answered;
  document.getElementById('check-btn').classList.remove('hidden');
  document.getElementById('skip-btn').classList.remove('hidden');
  document.getElementById('previous-btn').disabled = currentQuestion === 0;
  document.getElementById('next-btn').classList.add('hidden');
  
  updateProgress();
  if (answered && selectedOption !== null) {
    showAnswerFeedback(q, selectedOption === q.c);
  }
}

function selectOption(index, element) {
  if (answered) return;
  selectedOption = index;
  const options = document.querySelectorAll('.option');
  options.forEach(opt => opt.classList.remove('selected'));
  element.classList.add('selected');
  document.getElementById('check-btn').disabled = false;
}

function checkAnswer() {
  if (selectedOption === null || answered) return;
  answered = true;
  const q = activeQuestions[currentQuestion];
  const isCorrect = selectedOption === q.c;
  questionStates[currentQuestion] = { selectedOption, answered: true };
  
  if (isCorrect) {
    correctCount++;
    moduleScores[q.m].correct++;
  } else {
    incorrectCount++;
  }
  updateStats();
  showAnswerFeedback(q, isCorrect);
  saveProgress();
}

function showAnswerFeedback(q, isCorrect) {
  const options = document.querySelectorAll('.option');
  options.forEach((opt, index) => {
    opt.classList.add('disabled');
    if (index === q.c) opt.classList.add('correct');
    else if (index === selectedOption && !isCorrect) opt.classList.add('incorrect');
  });
  
  const feedback = document.getElementById('feedback-container');
  feedback.className = `feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
  document.getElementById('quiz-container').classList.toggle('answer-incorrect', !isCorrect);
  document.getElementById('question-text').classList.toggle('answer-incorrect', !isCorrect);
  document.getElementById('feedback-title').textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect';
  
  const explanationsContainer = document.getElementById('explanations-container');
  explanationsContainer.classList.add('collapsed');
  explanationsContainer.innerHTML = '';
  q.o.forEach((opt, index) => {
    const div = document.createElement('div');
    div.className = 'explanation-item';
    div.innerHTML = `<strong>${String.fromCharCode(65 + index)}. ${opt.substring(3)}</strong>${q.e[index]}`;
    explanationsContainer.appendChild(div);
  });
  const explanationToggle = document.getElementById('explanation-toggle');
  explanationToggle.classList.remove('hidden');
  explanationToggle.setAttribute('aria-expanded', 'false');
  explanationToggle.textContent = 'Show explanations';
  
  document.getElementById('check-btn').classList.add('hidden');
  document.getElementById('skip-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  if (currentQuestion === activeQuestions.length - 1) document.getElementById('next-btn').textContent = 'Finish Quiz';
}

function nextQuestion() {
  if (currentQuestion < activeQuestions.length - 1) {
    currentQuestion++;
    loadQuestion();
    saveProgress();
  } else {
    showResults();
  }
}

function skipQuestion() {
  if (answered) return;
  delete questionStates[currentQuestion];
  if (currentQuestion < activeQuestions.length - 1) {
    currentQuestion++;
    selectedOption = null;
    loadQuestion();
    saveProgress();
  } else {
    showResults();
  }
}

function previousQuestion() {
  if (currentQuestion === 0) return;
  currentQuestion--;
  loadQuestion();
  saveProgress();
}

function updateStats() {
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-incorrect').textContent = incorrectCount;
  const total = correctCount + incorrectCount;
  const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);
  document.getElementById('score-percent').textContent = percent + '%';
}

function updateProgress() {
  const percent = activeQuestions.length === 1
    ? 100
    : (currentQuestion / (activeQuestions.length - 1)) * 100;
  document.getElementById('progress-fill').style.width = percent + '%';
}

function showResults() {
  document.getElementById('header').classList.add('hidden');
  document.getElementById('quiz-container').classList.add('hidden');
  document.getElementById('results-container').classList.remove('hidden');
  
  const total = correctCount + incorrectCount;
  const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);
  
  document.getElementById('final-percent').textContent = percent + '%';
  document.getElementById('final-correct').textContent = correctCount;
  document.getElementById('final-total').textContent = activeQuestions.length;
  
  const rowsContainer = document.getElementById('module-rows');
  rowsContainer.innerHTML = '';
  for (const [mod, stats] of Object.entries(moduleScores)) {
    const modPercent = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
    const row = document.createElement('div');
    row.className = 'module-row';
    row.innerHTML = `<span>${mod}</span><strong>${stats.correct} / ${stats.total} (${modPercent}%)</strong>`;
    rowsContainer.appendChild(row);
  }
}

function restartQuiz() {
  currentQuestion = 0;
  correctCount = 0;
  incorrectCount = 0;
  selectedOption = null;
  answered = false;
  questionStates = {};
  moduleScores = {};
  setActiveQuestions();
  initModuleScores();
  updateStats();
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('quiz-container').classList.remove('hidden');
  document.getElementById('results-container').classList.add('hidden');
  document.getElementById('next-btn').textContent = 'Next Question';
  loadQuestion();
  saveProgress();
}

document.getElementById('module-select').addEventListener('change', event => {
  selectedModule = event.target.value;
  restartQuiz();
});
document.getElementById('check-btn').addEventListener('click', checkAnswer);
document.getElementById('skip-btn').addEventListener('click', skipQuestion);
document.getElementById('previous-btn').addEventListener('click', previousQuestion);
document.getElementById('next-btn').addEventListener('click', nextQuestion);
document.getElementById('save-btn').addEventListener('click', saveProgress);
document.getElementById('explanation-toggle').addEventListener('click', () => {
  const explanations = document.getElementById('explanations-container');
  const isCollapsed = explanations.classList.toggle('collapsed');
  const toggle = document.getElementById('explanation-toggle');
  toggle.setAttribute('aria-expanded', String(!isCollapsed));
  toggle.textContent = isCollapsed ? 'Show explanations' : 'Hide explanations';
});

populateModuleSelector();
if (!restoreProgress()) {
  setActiveQuestions();
  initModuleScores();
}
updateStats();
loadQuestion();
</script>
</body>
</html>
